<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <!-- Placement Tracker - static/login-bg.svg
       Stylised campus scene used as the sign-in background.  Drawn locally so
       the page never depends on an external image host and renders offline. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7dbff"/>
      <stop offset="45%" stop-color="#dcefff"/>
      <stop offset="100%" stop-color="#f5faff"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.76" cy="0.1" r="0.62">
      <stop offset="0" stop-color="#fff9dc" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fff4c6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff4c6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#a8c2dc"/>
      <stop offset="100%" stop-color="#d8e8f7"/>
    </linearGradient>

    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fafd"/>
      <stop offset="100%" stop-color="#dde7f2"/>
    </linearGradient>

    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d68c"/>
      <stop offset="100%" stop-color="#79bd63"/>
    </linearGradient>

    <pattern id="win" width="64" height="50" patternUnits="userSpaceOnUse">
      <rect width="64" height="50" fill="url(#glass)"/>
      <rect x="7" y="7" width="50" height="34" rx="4" fill="#eef6ff" opacity="0.9"/>
      <rect x="7" y="7" width="50" height="34" rx="4" fill="none" stroke="#8fb0d0" stroke-width="2" opacity="0.55"/>
    </pattern>

    <pattern id="winSm" width="46" height="38" patternUnits="userSpaceOnUse">
      <rect width="46" height="38" fill="url(#wall)"/>
      <rect x="6" y="6" width="34" height="24" rx="3" fill="#cfe0f2"/>
    </pattern>

    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="softer" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- distant skyline -->
  <g filter="url(#softer)" opacity="0.55">
    <rect x="-40" y="470" width="230" height="330" fill="#9fb8d2"/>
    <rect x="210" y="545" width="150" height="255" fill="#8fabc8"/>
    <rect x="380" y="500" width="120" height="300" fill="#a6bed6"/>
    <rect x="1130" y="520" width="170" height="280" fill="#93aecb"/>
    <rect x="1320" y="470" width="240" height="330" fill="#a2bad3"/>
  </g>

  <!-- main glass block, right -->
  <g>
    <rect x="960" y="150" width="620" height="650" rx="6" fill="url(#win)"/>
    <rect x="960" y="150" width="620" height="650" rx="6" fill="none" stroke="#7d9cbb" stroke-width="3" opacity="0.6"/>
    <rect x="960" y="150" width="620" height="26" fill="#e8f1fb"/>
    <rect x="960" y="416" width="620" height="10" fill="#eaf2fb" opacity="0.9"/>
    <!-- entrance canopy -->
    <rect x="1150" y="690" width="240" height="110" rx="4" fill="#dfeaf6"/>
    <rect x="1178" y="712" width="184" height="88" fill="#bcd3ea"/>
    <rect x="1150" y="676" width="240" height="18" rx="4" fill="#c9dcef"/>
  </g>

  <!-- academic block, left -->
  <g>
    <rect x="40" y="330" width="500" height="470" rx="5" fill="url(#winSm)"/>
    <rect x="40" y="330" width="500" height="470" rx="5" fill="none" stroke="#8ea9c4" stroke-width="3" opacity="0.55"/>
    <rect x="40" y="318" width="500" height="24" fill="#eef4fb"/>
    <rect x="40" y="556" width="500" height="9" fill="#e6eefa" opacity="0.85"/>
    <!-- colonnade -->
    <rect x="70" y="742" width="440" height="58" fill="#e7eef7"/>
    <g fill="#cddcec">
      <rect x="96" y="742" width="26" height="58"/>
      <rect x="176" y="742" width="26" height="58"/>
      <rect x="256" y="742" width="26" height="58"/>
      <rect x="336" y="742" width="26" height="58"/>
      <rect x="416" y="742" width="26" height="58"/>
    </g>
  </g>

  <!-- connecting wing -->
  <g filter="url(#soft)" opacity="0.9">
    <rect x="530" y="560" width="450" height="240" fill="url(#wall)"/>
    <rect x="530" y="560" width="450" height="240" fill="none" stroke="#9db5cd" stroke-width="3" opacity="0.5"/>
    <g fill="#c3d6ea">
      <rect x="570" y="600" width="70" height="90" rx="4"/>
      <rect x="676" y="600" width="70" height="90" rx="4"/>
      <rect x="782" y="600" width="70" height="90" rx="4"/>
      <rect x="888" y="600" width="70" height="90" rx="4"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="790" width="1600" height="210" fill="url(#lawn)"/>

  <!-- walkway -->
  <path d="M700 1000 L840 800 L980 800 L1120 1000 Z" fill="#e9eef4" opacity="0.95"/>
  <path d="M700 1000 L840 800 L860 800 L745 1000 Z" fill="#ffffff" opacity="0.35"/>

  <!-- trees -->
  <g>
    <g transform="translate(150 745)">
      <rect x="-11" y="60" width="22" height="90" rx="8" fill="#7a5a3c"/>
      <ellipse cx="0" cy="30" rx="78" ry="62" fill="#4f9e52"/>
      <ellipse cx="-42" cy="56" rx="48" ry="40" fill="#57ab5a"/>
      <ellipse cx="40" cy="52" rx="52" ry="42" fill="#43904a"/>
      <ellipse cx="6" cy="-6" rx="46" ry="36" fill="#63b765"/>
    </g>
    <g transform="translate(430 770)">
      <rect x="-9" y="50" width="18" height="80" rx="7" fill="#7a5a3c"/>
      <ellipse cx="0" cy="24" rx="62" ry="50" fill="#4a9850"/>
      <ellipse cx="-34" cy="46" rx="38" ry="32" fill="#54a557"/>
      <ellipse cx="32" cy="42" rx="40" ry="34" fill="#3f8b47"/>
    </g>
    <g transform="translate(1330 755)">
      <rect x="-10" y="56" width="20" height="86" rx="8" fill="#7a5a3c"/>
      <ellipse cx="0" cy="26" rx="70" ry="56" fill="#4f9e52"/>
      <ellipse cx="-38" cy="50" rx="44" ry="36" fill="#57ab5a"/>
      <ellipse cx="36" cy="46" rx="46" ry="38" fill="#43904a"/>
    </g>
    <g transform="translate(1520 785)">
      <rect x="-8" y="44" width="16" height="74" rx="6" fill="#7a5a3c"/>
      <ellipse cx="0" cy="20" rx="54" ry="44" fill="#4a9850"/>
      <ellipse cx="-28" cy="40" rx="34" ry="28" fill="#54a557"/>
    </g>
  </g>

  <!-- low hedge along the walkway -->
  <g fill="#3f8b47" opacity="0.92">
    <ellipse cx="640" cy="880" rx="86" ry="30"/>
    <ellipse cx="548" cy="900" rx="76" ry="26"/>
    <ellipse cx="1186" cy="892" rx="88" ry="30"/>
    <ellipse cx="1286" cy="914" rx="74" ry="26"/>
    <ellipse cx="300" cy="946" rx="96" ry="32"/>
    <ellipse cx="1440" cy="952" rx="94" ry="30"/>
  </g>

  <!-- soft foreground shade for readability under the card -->
  <rect y="880" width="1600" height="120" fill="#2b5f3a" opacity="0.08"/>
</svg>
